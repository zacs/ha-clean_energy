# Add this to your configuration.yaml (or include it via: template: !include test_sensor.yaml)
#
# Simulates a total_increasing energy sensor that:
# - Increments by 0.001–0.05 kWh every 10 seconds (normal residential noise)
# - ~5% chance per tick of a massive spike (500–5000 kWh) — roughly every 2–4 minutes
#
# To use: add to configuration.yaml under "template:" key, then restart HA.
# To remove: delete this block and restart.

- trigger:
    - platform: time_pattern
      seconds: "/10"
  sensor:
    - name: "Clean Energy Test Sensor"
      unique_id: clean_energy_test_sensor
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      # Track the "true" baseline as an attribute so spikes don't permanently
      # raise the running total. Each tick:
      #   - baseline grows by 0.001–0.05 kWh (normal residential noise)
      #   - ~5% of ticks emit baseline + a 500–5000 kWh spike (transient)
      #   - all other ticks emit just the baseline (so the spike "reverts")
      #
      # Note: `state` reads the prior tick's baseline (templates in a
      # trigger-based sensor all see the pre-update `this`), and the new
      # baseline is committed via the `baseline` attribute below. This keeps
      # the state and attribute consistent without calling random() twice.
      state: >
        {% set baseline = this.attributes.get('baseline', 0) | float(0) %}
        {% set is_spike = (range(1, 100) | random) <= 5 %}
        {% if is_spike %}
          {{ (baseline + (range(500, 5000) | random)) | round(3) }}
        {% else %}
          {{ baseline | round(3) }}
        {% endif %}
      attributes:
        baseline: >
          {{ ((this.attributes.get('baseline', 0) | float(0)) + (range(1, 50) | random) / 1000) | round(3) }}
